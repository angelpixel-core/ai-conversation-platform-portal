name: CI Operations Portal Quality Assurance

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  validate:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build & TypeScript Typecheck
        run: npm run build
        env:
          NEXT_PUBLIC_USE_MOCKS: 'true'

      - name: Run Vitest Test Suite
        run: npm test
